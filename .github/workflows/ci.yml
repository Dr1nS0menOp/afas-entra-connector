name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain (pinned in rust-toolchain.toml)
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt,clippy
          rustup show active-toolchain
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --locked

  supply-chain:
    name: Dependencies (RustSec, licences, sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cargo-deny and cargo-audit
        run: cargo install --locked cargo-deny@0.20.2 cargo-audit@0.22.2
      - name: cargo deny
        run: cargo deny check
      - name: cargo audit
        run: cargo audit

  repo-hygiene:
    name: Secrets, workflows and shell scripts
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install scanners
        run: pipx install detect-secrets==1.5.0 && pipx install zizmor==1.31.1 && pipx install shellcheck-py==0.11.0.1
      - name: No new secrets (reviewed baseline in .secrets.baseline)
        run: |
          git ls-files -z | xargs -0 detect-secrets-hook --baseline .secrets.baseline
      - name: Workflow security (zizmor)
        run: zizmor --offline .github/workflows/
      - name: Shell scripts (shellcheck)
        run: shellcheck -S style install.sh deploy/ansible/checkmk/afas_entra_sync

  evidence:
    name: Security evidence (OWASP ASVS)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ASVS assessment up to date and every reference resolves
        # Fetches the official ASVS 5.0.0 list at the v5.0.0_release tag and checks its SHA-256.
        run: python3 docs/security/asvs_assessment.py --check
      - name: Stored scan output unchanged
        run: |
          for d in docs/security/evidence/*/; do
            (cd "$d" && sha256sum -c --quiet SHA256SUMS)
          done

  fuzz:
    name: Fuzz smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Nightly toolchain and cargo-fuzz
        run: |
          rustup toolchain install nightly --profile minimal
          cargo install --locked cargo-fuzz@0.13.2
      - name: Run every fuzz target for 60 seconds
        run: |
          cd fuzz
          for t in afas_response config small_parsers gui_request; do
            cargo +nightly fuzz run -O "$t" "corpus/$t" -- -max_total_time=60
          done
