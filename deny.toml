# cargo-deny policy (https://embarkstudios.github.io/cargo-deny/). Run: cargo deny check
# Checked in CI on every push and pull request.

[graph]
# The program is shipped for Linux only.
targets = ["x86_64-unknown-linux-musl", "x86_64-unknown-linux-gnu"]
all-features = true

[advisories]
# RustSec advisory database: any known vulnerability, unmaintained or unsound crate fails.
version = 2
yanked = "deny"
unmaintained = "all"
unsound = "all"
ignore = []

[licenses]
# Only permissive licences compatible with Apache-2.0 distribution.
version = 2
allow = [
    "Apache-2.0",
    "MIT",
    "MIT-0",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "BSL-1.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = false

[sources]
# Crates only from crates.io; no git dependencies, no other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
