[package]
name = "afas-entra-sync"
version = "0.7.0"
edition = "2024"
rust-version = "1.89"
description = "AFAS Profit to Microsoft Entra API-driven inbound provisioning"
license = "Apache-2.0"
readme = "README.md"
keywords = ["afas", "entra-id", "provisioning", "scim", "active-directory"]
categories = ["command-line-utilities"]
exclude = ["deploy/ansible/files/*"]
publish = false

[dependencies]
base64 = "0.23.1"
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
getrandom = "0.4.3"
jsonwebtoken = { version = "11.1.0", features = ["aws_lc_rs"] }
pem = "4.0.0"
reqwest = { version = "0.13.5", features = ["blocking", "form", "json"] }
# Explicit TLS configuration (TLS 1.3, post-quantum key exchange). Same versions as reqwest uses.
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1 = "0.11.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
tiny_http = "0.12.0"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.29.0", features = ["v4"] }

[dev-dependencies]
mockito = "1.7.2"
proptest = "1.12.0"
tempfile = "3.27.0"
rcgen = "0.14"

[profile.release]
overflow-checks = true
panic = "unwind"
